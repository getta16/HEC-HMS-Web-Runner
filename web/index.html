<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEC-HMS Web Runner</title>
<script>
// apply saved theme before first paint
try { const t = localStorage.getItem('hms-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f3f6f5; --surface: #ffffff; --surface-2: #eaf0ee;
  --ink: #132020; --ink-2: #475755; --muted: #74837f;
  --line: #d5dedb; --grid: #e6ecea;
  --accent: #0c6a68; --accent-ink: #ffffff; --accent-soft: #d8ebe8;
  --s-out: #2a78d6; --s-ref: #eb6834; --s-inflow: #8a9895; --s-base: #1d7440;
  --precip: #b4c4c1; --excess: #2a78d6;
  --warn: #9a5b00; --warn-soft: #fbeed3; --bad: #b83433; --good: #1d7440;
  --font-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1413; --surface: #151d1c; --surface-2: #1b2524;
    --ink: #e6eeec; --ink-2: #b1c0bd; --muted: #7d8d8a;
    --line: #2a3634; --grid: #212b2a;
    --accent: #52b5ae; --accent-ink: #0b1312; --accent-soft: #1b3230;
    --s-out: #3987e5; --s-ref: #d95926; --s-inflow: #7d8d8a; --s-base: #5cc28a;
    --precip: #3f5350; --excess: #3987e5;
    --warn: #e0a54a; --warn-soft: #33280f; --bad: #e66767; --good: #5cc28a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1413; --surface: #151d1c; --surface-2: #1b2524;
  --ink: #e6eeec; --ink-2: #b1c0bd; --muted: #7d8d8a;
  --line: #2a3634; --grid: #212b2a;
  --accent: #52b5ae; --accent-ink: #0b1312; --accent-soft: #1b3230;
  --s-out: #3987e5; --s-ref: #d95926; --s-inflow: #7d8d8a; --s-base: #5cc28a;
  --precip: #3f5350; --excess: #3987e5;
  --warn: #e0a54a; --warn-soft: #33280f; --bad: #e66767; --good: #5cc28a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 19px; font-weight: 600; }
p { margin: 0; }
.mono, code, pre { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11.5px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

header.top { padding-block: 20px 0; display: grid; gap: 10px; }
.toprow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.prefs { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 12.5px var(--font-body); border: 0; background: transparent; color: var(--ink-2); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.switch { display: inline-flex; align-items: center; gap: 8px; font: 500 12.5px var(--font-body); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 4px 6px; cursor: pointer; }
.switch .track { width: 32px; height: 18px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(14px); }
.lede { color: var(--ink-2); max-width: 75ch; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; }
.notice b { color: var(--warn); font-weight: 600; }
.notice.err { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.notice.err b { color: var(--bad); }

.runbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 10px 16px; }
.runbar-inner { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.btn { font: 600 13.5px var(--font-body); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 7px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.attn { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn:focus-visible, input:focus-visible, select:focus-visible, .tab:focus-visible, tr[tabindex]:focus-visible, .node:focus-visible, .seg button:focus-visible, .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.runlog { font: 12.5px var(--font-mono); color: var(--muted); }
.runlog .ok { color: var(--good); } .runlog .bad { color: var(--bad); } .runlog .pend { color: var(--warn); }
.proj { font: 600 13px var(--font-mono); padding: 4px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .v { font: 600 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .v small { font: 500 13px var(--font-body); color: var(--muted); margin-left: 4px; }
.kpi .s { font-size: 13px; color: var(--ink-2); }
.kpis.stale .kpi { opacity: .55; }
.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--ink-2); font-size: 14px; grid-column: 1 / -1; }
.up { color: var(--bad); } .down { color: var(--good); }

.main { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.hint { font-size: 12.5px; color: var(--muted); }

.setup { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; align-items: end; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--ink-2); }
.field label .u { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; margin-left: 4px; }
.field input, .field select { font: 14px var(--font-mono); padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.field input.changed, .field select.changed { border-color: var(--accent); background: var(--accent-soft); }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.field .note { font-size: 11.5px; color: var(--muted); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; align-items: center; }

.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.filelist, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px var(--font-body); padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.mono { font-family: var(--font-mono); }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.chip.missing { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }

#net { width: 100%; height: auto; display: block; }
#net .link { stroke: var(--line); stroke-width: 2.5; fill: none; }
#net .link.div { stroke-dasharray: 6 5; }
#net .node { cursor: pointer; }
#net .node .shape { fill: var(--surface-2); stroke: var(--ink-2); stroke-width: 1.2; }
#net .node:hover .shape { stroke: var(--accent); }
#net .node.sel .shape { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.2; }
#net .lbl { font: 600 12px var(--font-body); fill: var(--ink); }
#net .pk { font: 500 11px var(--font-mono); fill: var(--ink-2); }

.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { font: 11px var(--font-mono); fill: var(--muted); }
.axis line.g { stroke: var(--grid); stroke-width: 1; }
.axis line.base { stroke: var(--ink-2); stroke-width: 1; }
.axis .ttl { font: 500 11px var(--font-body); fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.lkey { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.lkey.dash { border-top-style: dashed; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 190px; display: grid; gap: 3px; z-index: 3; }
.tip .t { font: 600 12px var(--font-mono); color: var(--ink); }
.tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--ink-2); }
.tip .r b { font: 500 12px var(--font-mono); color: var(--ink); }

.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
.group-title { grid-column: 1 / -1; font: 500 11.5px var(--font-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding-top: 4px; border-top: 1px solid var(--grid); }
.group-title:first-child { border-top: 0; padding-top: 0; }
.uh { grid-column: 1 / -1; font: 12.5px var(--font-mono); color: var(--ink-2); overflow-x: auto; white-space: nowrap; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 760px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font: 500 11.5px var(--font-body); color: var(--muted); vertical-align: bottom; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td:first-child { font-family: var(--font-body); font-weight: 500; }
td:nth-child(2) { font-family: var(--font-body); color: var(--muted); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--accent-soft); }
.sep { border-left: 1px solid var(--line); }
.err-lo { color: var(--good); } .err-mid { color: var(--warn); } .err-hi { color: var(--bad); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font: 500 12.5px var(--font-mono); border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.file-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
pre.file { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 12.5px; line-height: 1.55; max-height: 420px; overflow: auto; white-space: pre; color: var(--ink); }
pre.file .k { color: var(--accent); }
pre.file .b { color: var(--ink); font-weight: 600; }
.methods { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 20px; font-size: 13.5px; color: var(--ink-2); }
.methods b { color: var(--ink); font-weight: 600; display: block; font-size: 13px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="toprow">
      <span class="eyebrow" id="eyebrow">HEC-HMS 4.x · web runner</span>
      <div class="prefs">
        <div class="seg" role="group" aria-label="Language / ภาษา">
          <button id="lang-th" aria-pressed="true" lang="th">ไทย</button>
          <button id="lang-en" aria-pressed="false" lang="en">EN</button>
        </div>
        <button class="switch" id="theme" role="switch" aria-checked="false"><span class="track"></span><span data-i18n="darkMode"></span></button>
      </div>
    </div>
    <h1>HEC-HMS Web Runner</h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="notice" role="note"><span>⚠</span><span data-i18n-html="notice"></span></div>
    <div class="notice err" role="alert" id="err" hidden></div>
  </header>

  <div class="runbar">
    <div class="runbar-inner">
      <span class="proj" id="proj-name">—</span>
      <button class="btn ghost" id="up-files" data-i18n="upFiles" data-i18n-title="upFilesTip"></button>
      <button class="btn ghost" id="up-folder" data-i18n="upFolder" data-i18n-title="upFolderTip"></button>
      <input type="file" id="in-files" multiple hidden>
      <input type="file" id="in-folder" webkitdirectory multiple hidden>
      <button class="btn" id="run" data-i18n="run"></button>
      <button class="btn ghost" id="reset" data-i18n="reset"></button>
      <span class="runlog" id="runlog" aria-live="polite"></span>
    </div>
  </div>

  <section class="panel" aria-labelledby="s-title">
    <div class="panel-head"><h2 id="s-title" data-i18n="setupTitle"></h2><span class="hint" id="s-hint"></span></div>
    <div class="setup">
      <div class="field"><label for="sel-run">Simulation Run</label><select id="sel-run"></select></div>
      <div class="field"><label for="sel-basin">Basin Model</label><select id="sel-basin"></select></div>
      <div class="field"><label for="sel-met">Meteorologic Model</label><select id="sel-met"></select></div>
      <div class="field"><label for="sel-control">Control Specifications</label><select id="sel-control"></select></div>
      <div class="field"><label for="c-start" data-i18n="start"></label><input type="datetime-local" id="c-start" step="60"></div>
      <div class="field"><label for="c-end" data-i18n="end"></label><input type="datetime-local" id="c-end" step="60"></div>
      <div class="field"><label for="c-dt">Time Interval</label><select id="c-dt"></select></div>
      <div class="field"><span class="note" id="c-info"></span></div>
      <div class="row-actions">
        <button class="btn ghost" id="c-fit" data-i18n="fitRain"></button>
        <button class="btn ghost" id="c-revert" data-i18n="revertCtl"></button>
        <span class="hint" data-i18n="ctlHint"></span>
      </div>
    </div>
    <div class="drop" id="drop">
      <span data-i18n="dropHere"></span>
      <div class="filelist" id="filelist"></div>
    </div>
  </section>

  <section class="kpis" id="kpis" aria-label="Outlet summary"></section>

  <section class="main">
    <div class="panel">
      <div class="panel-head"><h2 data-i18n="netTitle"></h2><span class="hint" data-i18n="netHint"></span></div>
      <svg id="net" viewBox="0 0 400 300" role="img" aria-label="Basin network"></svg>
      <div class="legend"><span><span class="swatch" style="background:var(--surface-2);border:1px solid var(--ink-2)"></span>Subbasin</span><span><span class="swatch" style="background:var(--surface-2);border:1px solid var(--ink-2);border-radius:99px"></span>Junction / Sink</span><span id="leg-res" hidden>▽ Reservoir</span><span id="leg-div" hidden>◇ Diversion</span><span id="net-unit"></span></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div style="display:grid;gap:2px"><span class="eyebrow" id="el-kind"></span><h2 id="el-name"></h2></div>
        <div class="chips" id="el-chips"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart-box" id="chart-box">
        <svg id="hyeto" aria-label="Hyetograph"></svg>
        <svg id="hydro" aria-label="Hydrograph"></svg>
        <div class="empty" id="chart-empty" hidden></div>
        <div class="tip" id="tip" hidden></div>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="p-title">
    <div class="panel-head"><h2 id="p-title"></h2><span class="hint" id="p-hint"></span></div>
    <div class="params" id="params"></div>
  </section>

  <section class="panel" aria-labelledby="t-title">
    <div class="panel-head"><h2 id="t-title" data-i18n="tblTitle"></h2><span class="hint" id="t-hint"></span></div>
    <div class="tbl-wrap"><table id="summary"></table></div>
  </section>

  <section class="panel" aria-labelledby="f-title">
    <div class="panel-head"><h2 id="f-title" data-i18n="filesTitle"></h2><span class="hint" data-i18n="filesHint"></span></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="file-meta"><span class="hint" id="file-desc"></span><span style="display:flex;gap:8px"><button class="btn ghost" id="copy" data-i18n="copy"></button><button class="btn ghost" id="download" data-i18n="download"></button></span></div>
    <pre class="file" id="file" tabindex="0"></pre>
  </section>

  <section class="panel" aria-labelledby="m-title">
    <h2 id="m-title" data-i18n="methodsTitle"></h2>
    <div class="methods" data-i18n-html="methods"></div>
  </section>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const H = window.MiniHMS;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const base = (p) => p.split(/[\\/]/).pop();
  const lc = (s) => (s || '').toLowerCase();
  const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
  const TEXT_EXT = /\.(hms|basin|met|gage|grid|control|run|pdata|results)$/i;
  const VIEW_EXT = /\.(hms|basin|met|gage|grid|control|run|pdata)$/i;

  // ---------- language ----------
  const I18N = {
    th: {

      methods: '<p><b>ฝน · Specified Average / Weighted Gages</b>อ่านฝนจากไฟล์ .dss ตาม Pathname ใน .gage (ฝนรายช่วงหรือฝนสะสม) แล้วกระจายลงแต่ละ time step แบบเส้นตรงบนกราฟฝนสะสม Weighted Gages ถ่วงน้ำหนักความลึกด้วย Volume Weight และรูปแบบด้วย Temporal Distribution Weight รองรับ HEC-1 weighting, indexing และ depth override</p><p><b>ฝน · Frequency Based Hypothetical</b>สร้างพายุออกแบบจากตารางความลึก–ช่วงเวลา (log-log) วางฝนสลับก่อน/หลัง peak ที่ time step ของ control รองรับ Re-sort และ Depth-Area Reduction แบบ TP-40/TP-49</p><p><b>ฝน · Gridded Precipitation</b>อ่าน grid ฝน (HRAP/SHG) จาก DSS 6 หรือ 7 และไฟล์ grid cell (File-Specified) คำนวณ loss ราย cell และใช้ Modified Clark ราย cell</p><p><b>คายระเหย · Monthly Evaporation</b>ค่า pan × สัมประสิทธิ์รายเดือน กระจายเท่ากันตลอดเดือน</p><p><b>Loss · Initial+Constant / SCS Curve Number / Deficit Constant / Soil Moisture Accounting</b>SMA ใช้ร่วมกับ Canopy และ Surface แบบ Simple โดยแบ่ง sub-step แบบเดียวกับ HEC-HMS</p><p><b>Transform · User-Specified UH / SCS / Clark / Snyder / Modified Clark</b>สร้าง UH ด้วยขั้นตอนเดียวกับ HEC-HMS 4.13 (SCS ใช้ spline, Snyder แปลงเป็น Clark แบบวนซ้ำ)</p><p><b>Baseflow · Recession / Linear Reservoir</b>Linear Reservoir รับน้ำจาก groundwater ของ SMA</p><p><b>Routing · Lag / Muskingum / Modified Puls</b>Modified Puls ใช้ตาราง Storage-Outflow แบ่ง subreach</p><p><b>Reservoir · Outflow Structures</b>ตาราง Elevation-Storage/Area กับ orifice, culvert (box, circular; วิธี FHWA/HY-8), ปั๊ม Head-Discharge, ogee / broad-crested spillway และ level dam top พร้อม tailwater แบบ Specified Stage ยังไม่รองรับการระเหย, gate และ dam break</p><p><b>Diversion · Inflow-Diversion Table</b>ผันน้ำตามตาราง จำกัดด้วยอัตราและปริมาตรผันสูงสุด แล้วส่งน้ำที่ผันไปยัง element ปลายทาง</p><p><b>ไฟล์ DSS</b>อ่าน DSS เวอร์ชัน 6 และ 7: time series (รวมที่ถูกบีบอัด), paired data และ grid</p>',

    en: {

      lede: 'Reads HEC-HMS project files (.hms, .basin, .met, .gage, .control, .run, .pdata and .dss) and computes runoff in the browser. Files are read on your computer and never uploaded to a server. The <b>Vara1</b> project opens by default. To use another project, upload its whole folder or drag the files onto this page.',
      notice: '<b>Results are approximate, not HEC-HMS itself.</b> The engine is a JavaScript re-implementation of HEC-HMS methods. When the time interval equals the unit hydrograph duration the results match HEC-HMS; at a finer interval (for example 1 minute) the peak differs by about 1% because the UH is resampled differently. When RUN_*.results files are present, this page compares against HEC-HMS.',

      filesHint: 'Dot on a tab = edited on this page · Download saves the edited file',
      copy: 'Copy', copied: 'Copied', pressCopy: 'Press Ctrl+C', download: 'Download this file',
      methodsTitle: 'Supported methods',
      methods: '<p><b>Precipitation · Specified Average / Weighted Gages</b>Reads gage rainfall (incremental or cumulative) from .dss at the Pathname in the .gage file and spreads it over each time step along the cumulative curve. Weighted Gages weight depth by Volume Weight and the pattern by Temporal Distribution Weight, with the HEC-1 scheme, indexing and depth override.</p><p><b>Precipitation · Frequency Based Hypothetical</b>Design storm from the depth–duration table (log-log), blocks placed alternately around the peak at the control time step. Re-sort and TP-40/TP-49 depth-area reduction supported.</p><p><b>Precipitation · Gridded Precipitation</b>Reads rainfall grids (HRAP/SHG) from DSS 6 or 7 with a File-Specified grid-cell file; loss is computed per cell and Modified Clark per cell.</p><p><b>Evapotranspiration · Monthly Evaporation</b>Pan × monthly coefficient spread evenly over the month.</p><p><b>Loss · Initial+Constant / SCS Curve Number / Deficit Constant / Soil Moisture Accounting</b>SMA works with Simple canopy and Simple surface, using the same sub-stepping as HEC-HMS.</p><p><b>Transform · User-Specified UH / SCS / Clark / Snyder / Modified Clark</b>Unit hydrographs are built the same way as HEC-HMS 4.13 (SCS with a spline, Snyder iterated into Clark Tc and R).</p><p><b>Baseflow · Recession / Linear Reservoir</b>Linear Reservoir is fed by the SMA groundwater layers.</p><p><b>Routing · Lag / Muskingum / Modified Puls</b>Modified Puls uses the storage-outflow table split into subreaches.</p><p><b>Reservoir · Outflow Structures</b>Elevation-storage/area table with orifice, culvert (box, circular; FHWA/HY-8 method), head-discharge pump, ogee / broad-crested spillway and level dam top, with Specified Stage tailwater. Evaporation, gates and dam break are not supported yet.</p><p><b>Diversion · Inflow-Diversion Table</b>Diverts flow by table, limited by the maximum diversion flow and volume, and sends it to the target element.</p><p><b>DSS files</b>Reads DSS version 6 and 7: time series (including compressed), paired data and grids.</p>',

    const ok = inp.value.trim() !== '' && !isNaN(v) && v >= min && v <= max && (inp.dataset.key !== 'Muskingum Steps' || Number.isInteger(v));
    inp.setAttribute('aria-invalid', ok ? 'false' : 'true');
    if (!ok) { $('runlog').innerHTML = `<span class="bad">${esc(t('badRange', inp.dataset.key, min, max === Infinity ? '∞' : max))}</span>`; return; }
    const blk = S.blocks.find(b => b.name === selected && b.kind !== 'Basin');
    if (!(inp.dataset.key in blk.props)) blk.order.push(inp.dataset.key);
    blk.props[inp.dataset.key] = inp.value.trim();
    inp.classList.toggle('changed', blk.props[inp.dataset.key] !== JSON.parse(S.original)[S.blocks.indexOf(blk)][inp.dataset.key]);
    markChanged();
  });

  // ---------- summary table ----------
  const errClass = (v) => { const a = Math.abs(v); return a < 3 ? 'err-lo' : a < 10 ? 'err-mid' : 'err-hi'; };
  function renderTable() {
    if (!OUT) { $('summary').innerHTML = ''; $('t-hint').textContent = ''; return; }
    const u = OUT.u, ref = refFor(), withRef = ref && ref.match;
    $('t-hint').textContent = withRef ? t('tRef', S.runName, ref.r.executed || '?') : t('tNoRef');
    let h = `<thead><tr><th>${t('thEl')}</th><th>${t('thKind')}</th><th>${esc(t('thArea', u.area))}</th><th class="sep">${esc(t('thPeak', u.flow))}</th><th>${t('thTime')}</th><th>${esc(t('thVol', u.vol))}</th><th>${esc(t('thDepth', u.depth))}</th>`
      + (withRef ? `<th class="sep">${t('thRef')}</th><th>${t('thRefTime')}</th><th>${t('thErr')}</th>` : '') + `</tr></thead><tbody>`;
    for (const name of OUT.order) {
      const r = OUT.results[name], rr = withRef ? ref.r.elements[name] : null;
      h += `<tr data-name="${esc(name)}" tabindex="0" class="${name === selected ? 'sel' : ''}"><td>${esc(name)}</td><td>${r.kind}</td><td>${fAuto(r.area)}</td>
        <td class="sep">${fAuto(r.stats.peak)}</td><td>${H.fmtDateTime(r.stats.peakTime)}</td><td>${fAuto(r.stats.vol)}</td><td>${fAuto(r.stats.depth)}</td>`;
      if (withRef) { const e = rr ? pct(r.stats.peak, rr.peak) : NaN; h += `<td class="sep">${rr ? fAuto(rr.peak) : '—'}</td><td>${rr && rr.peakTime ? H.fmtDateTime(rr.peakTime) : '—'}</td><td class="${errClass(e)}">${sgn(e)}</td>`; }
      h += '</tr>';
    }
    $('summary').innerHTML = h + '</tbody>';
  }
  $('summary').addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-name]'); if (tr) select(tr.dataset.name); });
  $('summary').addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-name]'); if (tr && ev.key === 'Enter') select(tr.dataset.name); });

  // ---------- files ----------
  function fileText(name) {
    if (!P) return '';
    if (S && name === S.basinFile && S.blocks) return H.writeHms(S.blocks);
    if (S && name === S.controlFile && S.ctlBlocks) return H.writeHms(S.ctlBlocks);
    const d = P.dss[lc(name)];
    if (d) {
      if (d.error) return t('unreadable', d.error);
      return t('dssHead', d.records.length) + '\n\n' + d.records.map(r => `${r.path}\n     ${r.values ? `${r.pattern ? t('dssPat') : t('dssTs')} · ${t('dssVals', r.n)} · ${r.units} ${r.dataType}` : t('dssSkip', r.type)}`).join('\n');
    }
    return P.texts[name] || '';
  }
  function isEdited(name) {
    if (!S) return false;
    if (name === S.basinFile && S.blocks) return JSON.stringify(S.blocks.map(b => b.props)) !== S.original;
    if (name === S.controlFile && S.ctlBlocks) return JSON.stringify(S.ctlBlocks.map(b => b.props)) !== S.ctlOriginal;
    return false;
  }
  function renderFile() {
    if (!P) return;
    const names = [...Object.keys(P.texts).filter(n => VIEW_EXT.test(n)), ...P.dssNames];
    if (!names.includes(curFile)) curFile = names[0];
    $('tabs').innerHTML = names.map(n => `<button class="tab" role="tab" aria-selected="${n === curFile}" data-f="${esc(n)}">${esc(n)}${isEdited(n) ? '<span class="dot"></span>' : ''}</button>`).join('');
    const isDss = /\.dss$/i.test(curFile || '');
    $('file-desc').textContent = isDss ? t('fDss') : (isEdited(curFile) ? t('fEdited') : t('fAsLoaded'));
    $('download').disabled = isDss;
    $('file').innerHTML = esc(fileText(curFile)).split('\n').map(l => {
      const m = /^(\s*)([^:]+):(.*)$/.exec(l);
      if (!m || isDss) return l;
      return m[1] ? `${m[1]}<span class="k">${m[2]}</span>:${m[3]}` : `<span class="b">${m[2]}:${m[3]}</span>`;
    }).join('\n');
  }
  $('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('[data-f]'); if (b) { curFile = b.dataset.f; renderFile(); } });
  $('copy').addEventListener('click', () => {
    const done = () => { $('copy').textContent = t('copied'); setTimeout(() => { $('copy').textContent = t('copy'); }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('file')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $('copy').textContent = t('pressCopy'); };
    try { navigator.clipboard.writeText(fileText(curFile)).then(done, fallback); } catch (_) { fallback(); }
  });
  $('download').addEventListener('click', () => {
    const blob = new Blob([fileText(curFile).replace(/\n/g, '\r\n')], { type: 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = curFile; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('run').addEventListener('click', () => { if (!S) return; $('runlog').textContent = t('running'); setTimeout(runModel, 10); });
  $('reset').addEventListener('click', () => {
    if (!S) return;
    S.blocks = H.parseHms(P.texts[S.basinFile]);
    if (S.controlFile) S.ctlBlocks = H.parseHms(P.texts[S.controlFile]);
    renderControlFields(); renderParams(); renderNet(); markChanged();
    $('runlog').innerHTML += ` · ${esc(t('resetDone'))}`;
  });

  // ---------- default project ----------
  applyStatic();
  const DEFAULT = { dir: 'data/vara1/', files: ['Vara1.hms', 'SEP.basin', 'Met_1.met', 'Vara1.gage', 'Control_1.control', 'Control_30.control', 'Vara1.run', 'Vara1.pdata', 'Vara1.dss', 'RUN_Run_1.results', 'RUN_Run_30.results'] };
  (async function boot() {
    $('runlog').textContent = t('loadingDefault');
    try {
      const files = await Promise.all(DEFAULT.files.map(async (n) => {
        const r = await fetch(DEFAULT.dir + n);
        if (!r.ok) throw new Error(t('loadFail', n, r.status));
        return /\.dss$/i.test(n) ? { name: n, buf: await r.arrayBuffer() } : { name: n, text: await r.text() };
      }));
      openProject(files);
    } catch (e) {
      $('runlog').textContent = '';
      showError(t('defaultFail', e.message));
    }
  })();
})();
</script>
</body>
</html>
